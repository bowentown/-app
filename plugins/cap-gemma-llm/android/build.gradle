buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

apply plugin: 'com.android.library'

// Capacitor 模板将 SDK 版本定义在根项目 ext；子项目用 rootProject 访问，
// 并以安全兜底防止模板版本差异导致配置阶段抛错（CI 实测踩坑）。
def safeExt(name, fallback) {
    try {
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
    } catch (Exception e) {
        return fallback
    }
}

android {
    namespace "com.somnacare.gemmallm"
    compileSdk safeExt('compileSdkVersion', 35)
    defaultConfig {
        minSdkVersion safeExt('minSdkVersion', 24)
        targetSdkVersion safeExt('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    // MediaPipe LLM Inference：预编译 AAR（含原生 .so），无需 NDK 构建
    implementation 'com.google.mediapipe:tasks-genai:0.10.32'
}
