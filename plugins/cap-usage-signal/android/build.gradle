buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

apply plugin: 'com.android.library'

// 与 cap-gemma-llm 同款安全兜底：Capacitor 模板把 SDK 版本定义在根项目 ext
def safeExt(name, fallback) {
    try {
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
    } catch (Exception e) {
        return fallback
    }
}

android {
    namespace "com.somnacare.usagesignal"
    compileSdk safeExt('compileSdkVersion', 35)
    defaultConfig {
        minSdkVersion safeExt('minSdkVersion', 24)
        targetSdkVersion safeExt('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
}
