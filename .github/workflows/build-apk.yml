name: Build Standalone Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate App Source & Normalize Root
        run: |
          echo "=== 检查仓库目录结构 ==="
          ls -la
          
          # 如果 package.json 不在根目录，自动在子目录中查找并拉到根目录
          if [ ! -f "package.json" ]; then
            PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              SUB_DIR=$(dirname "$PKG_PATH")
              echo "检测到源码存放在子目录 [$SUB_DIR]，正在自动提升至根目录..."
              cp -r "$SUB_DIR"/* .
              # 复制可能存在的隐藏文件
              cp -r "$SUB_DIR"/.[!.]* . 2>/dev/null || true
            fi
          fi

          if [ ! -f "package.json" ]; then
            echo "::error::未找到 package.json！请确认您上传的代码包包含 package.json 和 src。"
            exit 1
          fi
          
          echo "源码已就绪，当前根目录结构："
          ls -la

      - name: Install Project Dependencies
        run: |
          # 使用 --legacy-peer-deps 确保无论任何 npm 版本都能 100% 成功安装
          npm install --legacy-peer-deps

      - name: Build Local Offline Dist
        run: |
          npm run build
          ls -la dist/

      - name: Install Capacitor Core & Android & Local Notifications Plugin
        run: |
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications

      - name: Configure Capacitor for 100% Local Offline App
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.somnacare.sleep",
            "appName": "极光睡眠",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Create Native Android Project & Embed Offline Assets
        run: |
          npx cap add android
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Configure Android SDK, Permissions & Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # 注入 AndroidManifest 核心闹钟与通知权限 (Android 12/13/14 必需，进程级息屏唤醒)
          # RECORD_AUDIO 供 WebView getUserMedia 做枕边环境声级采样（Capacitor 桥接运行时授权）
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\
          <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
          <uses-permission android:name="android.permission.WAKE_LOCK" />\
          <uses-permission android:name="android.permission.RECORD_AUDIO" />\
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' android/app/src/main/AndroidManifest.xml
          
          # 统一 Kotlin 依赖，避免 duplicate class
          sed -i '/dependencies {/i \
          configurations.all {\
              resolutionStrategy {\
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"\
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\
              }\
          }' android/app/build.gradle

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Compile Standalone Offline APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Standalone Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: SomnaCare-Offline-Local-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
