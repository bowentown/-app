// 固定签名配置 —— 由 CI 在 `npx cap add android` 之后追加到 android/app/build.gradle。
//
// 背景：此前 CI 每次 assembleDebug 用的都是 runner 上自动生成的 debug 密钥，
// 而 GitHub runner 是一次性的——每次构建都是一把新钥匙，用户覆盖安装被
// Android 拒绝，只能卸载重装（全部数据丢失）。
//
// 密钥从环境变量读取（workflow 已从 GitHub Secrets 注入），仓库里永远
// 不出现密钥文件或密码。keystore 丢失 = 已装用户永远无法再覆盖更新，
// 务必在本地密码管理器另存一份（见 README 发布一节）。
android {
    signingConfigs {
        somnacareRelease {
            storeFile file(System.getenv("SIGNING_STORE_FILE") ?: "somnacare-release.keystore")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.somnacareRelease
            // 不开混淆/裁剪：Capacitor + MediaPipe LLM Inference 的反射面大，
            // 保持与此前 debug 产物一致的行为；APK 体积优化另行评估
            minifyEnabled false
            shrinkResources false
        }
    }
}
